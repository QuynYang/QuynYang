name: Metrics

on:
  # Chạy mỗi ngày lúc 00:00 UTC
  schedule:
    - cron: "0 0 * * *"

  # Cho phép chạy thủ công
  workflow_dispatch:

  # Chạy khi push lên master/main
  push:
    branches:
      - master
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@latest
        with:
          # Personal Access Token lưu trong Secrets
          token: ${{ secrets.METRICS_TOKEN }}

          # GitHub username
          user: QuynYang

          # Output
          filename: github-metrics.svg

          # Template
          template: classic

          # Hiển thị thông tin cơ bản
          base: header, activity, community, repositories, metadata

          config_timezone: Asia/Ho_Chi_Minh

          #############################################
          # Isometric Calendar
          #############################################
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          #############################################
          # Languages
          #############################################
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_categories: programming, markup
          plugin_languages_threshold: 0%
          plugin_languages_colors: github
          plugin_languages_analysis_timeout: 15
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_recent_categories: programming, markup
